<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NeuroFarma 3D</title>
<meta name="description" content="Aplicación interactiva de neurofarmacología: cómo actúan analgésicos, anestésicos, sedantes, hipnóticos, ansiolíticos, barbitúricos, antiepilépticos y antipsicóticos sobre los neurotransmisores, con cerebro 3D, sinapsis animada, potencial de acción y EEG.">
<meta name="theme-color" content="#070b13">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23070b13'/%3E%3Cpath d='M9 22c-3-2-3-8 1-10 0-4 5-5 7-3 3-2 7 0 7 4 3 1 3 6 0 8-1 3-5 3-7 2-2 2-6 2-8-1z' fill='none' stroke='%233dd6d0' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23ffe7a3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="barra">
  <a class="marca" href="#/fundamentos" aria-label="NeuroFarma 3D, inicio">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M9 22c-3-2-3-8 1-10 0-4 5-5 7-3 3-2 7 0 7 4 3 1 3 6 0 8-1 3-5 3-7 2-2 2-6 2-8-1z" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--cat)"/><circle cx="16" cy="16" r="2.6" fill="#ffe7a3"/><path d="M16 13.4V9M18.4 17.2l3.6 2.4M13.6 17.2 10 19.6" stroke="#ffe7a3" stroke-width="1.4" stroke-linecap="round"/></svg>
    <span>NeuroFarma <b>3D</b></span>
  </a>
  <nav class="categorias" id="nav" aria-label="Categorías de fármacos"></nav>
  <div class="herramientas">
    <a class="boton" href="#/comparador" title="Comparador de fármacos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 4v16M16 4v16M4 8h8M12 16h8"/></svg><span>Comparador</span></a>
    <a class="boton" href="#/casos" title="Casos clínicos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 4h6v3H9zM6 6h12v14H6z"/><path d="M12 11v5M9.5 13.5h5"/></svg><span>Casos</span></a>
    <a class="boton" href="#/quiz" title="Autoevaluación"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.7M12 17h.01"/></svg><span>Quiz</span></a>
  </div>
</header>

<main class="app" id="app">
  <section class="escenario" id="escenario" aria-label="Cerebro en 3D">
    <div class="lienzo-3d" id="cerebro"></div>
    <div class="controles-3d">
      <div class="grupo-botones" id="vistas" role="group" aria-label="Vista de cámara">
        <button data-vista="general">General</button>
        <button data-vista="lateralIzq">Lateral</button>
        <button data-vista="medial">Corte medial</button>
        <button data-vista="superior">Superior</button>
        <button data-vista="tronco">Tronco</button>
        <button data-vista="medula">Médula</button>
      </div>
      <div class="grupo-botones" role="group" aria-label="Corteza">
        <button data-corteza="cristal" aria-pressed="true">Cristal</button>
        <button data-corteza="tejido">Tejido</button>
        <button data-giro aria-pressed="false" title="Girar automáticamente">↻</button>
      </div>
    </div>
    <div class="titulo-escena" id="titulo-escena"></div>
    <div class="nota-3d">Arrastra para girar · rueda para acercar · toca una estructura</div>
    <div class="leyenda-3d" id="leyenda"></div>
    <div class="interruptor" id="interruptor"></div>
    <div class="recorrido oculto" id="recorrido" role="dialog" aria-live="polite"></div>
  </section>

  <aside class="lateral" id="lateral" aria-label="Información"></aside>

  <div class="paneles">
    <section class="panel panel-sinapsis" id="panel-sinapsis">
      <div class="panel-cabeza">
        <h3>Nivel molecular</h3>
        <div class="pestanas-mini" id="escenas" role="tablist"></div>
        <span class="espacio"></span>
        <div id="controles-escena" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"></div>
        <button class="chip-toggle" id="btn-rotulos" aria-pressed="true">Rótulos</button>
        <button class="boton-ampliar" data-ampliar="panel-sinapsis" title="Ampliar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
      <div class="panel-cuerpo"><canvas id="lienzo-sinapsis" aria-label="Animación de la sinapsis"></canvas></div>
    </section>
    <section class="panel panel-derecho" id="panel-derecho">
      <div class="panel-cabeza">
        <div class="pestanas-mini" role="tablist" id="pest-derecho">
          <button role="tab" data-panel="potencial" aria-selected="true">Potencial de acción</button>
          <button role="tab" data-panel="monitor" aria-selected="false">EEG y monitor</button>
        </div>
        <span class="espacio"></span>
        <span class="sub" id="sub-derecho"></span>
        <button class="boton-ampliar" data-ampliar="panel-derecho" title="Ampliar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
      <div class="panel-cuerpo" id="cuerpo-potencial"><canvas id="lienzo-potencial" aria-label="Potencial de membrana"></canvas></div>
      <div class="panel-cuerpo monitor-cuerpo oculto" id="cuerpo-monitor">
        <div class="lienzo-monitor"><canvas id="lienzo-monitor" aria-label="EEG y espectrograma"></canvas></div>
        <div class="indicadores" id="indicadores"></div>
      </div>
    </section>
  </div>
</main>

<div class="herramienta oculto" id="herramienta"></div>
<noscript><p style="padding:20px">Esta aplicación necesita JavaScript.</p></noscript>
<script src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dosis de Inglés</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Tu plan diario de inglés basado en evidencia: repetición espaciada, oído fino, escucha, gramática, habla y escritura, con contenido de química farmacéutica.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Charis+SIL:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell — rail lateral (escritorio) / barra inferior (teléfono); una columna de lectura de ~780px;
   la sesión diaria es una «prescripción» (℞) y el progreso semanal un blíster de cápsulas. */
:root{
  --paper:#F1F5F3; --surface:#FFFFFF; --sunk:#E6EEEA; --raise:#FAFCFB;
  --ink:#10302A; --ink-2:#48615B; --ink-3:#71877F; --line:#D2DED9; --line-2:#BCCCC5;
  --pine:#0D6A5A; --pine-ink:#FFFFFF; --pine-soft:#DCEDE7; --pine-deep:#0A4F43;
  --amber:#A8650C; --amber-fill:#E59F3A; --amber-soft:#F6E8D0;
  --good:#1F7546; --good-soft:#DAEEE1; --bad:#B03726; --bad-soft:#F6DFDA; --warn:#8E6208; --warn-soft:#F4E9CC;
  --ev-solido:#1F7546; --ev-respaldado:#0D6A5A; --ev-emergente:#8E6208; --ev-discutido:#7A4FA0; --ev-mito:#B03726;
  --shadow:0 1px 2px rgba(16,48,42,.06),0 6px 18px rgba(16,48,42,.07);
  --focus:0 0 0 3px rgba(13,106,90,.35);
  --font-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --font-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --font-ipa:"Charis SIL","Doulos SIL","Gentium Plus","Lucida Sans Unicode","Segoe UI",serif;
  --fs-xs:.78rem; --fs-sm:.875rem; --fs-md:1rem; --fs-lg:1.18rem; --fs-xl:1.5rem; --fs-2xl:2rem; --fs-3xl:2.6rem;
  --r-sm:6px; --r-md:10px; --r-lg:16px; --r-pill:999px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0B1613; --surface:#11201C; --sunk:#0E1B18; --raise:#152723;
    --ink:#E1EDE8; --ink-2:#A3B8B1; --ink-3:#7D938C; --line:#223630; --line-2:#2E4740;
    --pine:#4CC0A4; --pine-ink:#05211A; --pine-soft:#173A31; --pine-deep:#7FD8C1;
    --amber:#EAAA4C; --amber-fill:#E59F3A; --amber-soft:#382A15;
    --good:#6FCB90; --good-soft:#15342A; --bad:#F2917E; --bad-soft:#3D1F1A; --warn:#E6C066; --warn-soft:#382F17;
    --ev-solido:#6FCB90; --ev-respaldado:#4CC0A4; --ev-emergente:#E6C066; --ev-discutido:#C3A2E6; --ev-mito:#F2917E;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.28);
    --focus:0 0 0 3px rgba(76,192,164,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0B1613; --surface:#11201C; --sunk:#0E1B18; --raise:#152723;
  --ink:#E1EDE8; --ink-2:#A3B8B1; --ink-3:#7D938C; --line:#223630; --line-2:#2E4740;
  --pine:#4CC0A4; --pine-ink:#05211A; --pine-soft:#173A31; --pine-deep:#7FD8C1;
  --amber:#EAAA4C; --amber-fill:#E59F3A; --amber-soft:#382A15;
  --good:#6FCB90; --good-soft:#15342A; --bad:#F2917E; --bad-soft:#3D1F1A; --warn:#E6C066; --warn-soft:#382F17;
  --ev-solido:#6FCB90; --ev-respaldado:#4CC0A4; --ev-emergente:#E6C066; --ev-discutido:#C3A2E6; --ev-mito:#F2917E;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.28);
  --focus:0 0 0 3px rgba(76,192,164,.45);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:var(--fs-2xl);font-weight:800}
h2{font-size:var(--fs-xl);font-weight:700}
h3{font-size:var(--fs-lg);font-weight:700}
p{margin:0}
a{color:var(--pine)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:var(--r-sm)}
.mono{font-family:var(--font-mono);font-size:var(--fs-xs);letter-spacing:.06em;text-transform:uppercase}
.ipa{font-family:var(--font-ipa);letter-spacing:.01em}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.small{font-size:var(--fs-sm)}
.tnum{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-lg{display:flex;flex-direction:column;gap:22px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row-between{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.grow{flex:1 1 auto;min-width:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh}
.rail{display:none}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--paper)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--font-display);font-weight:800;font-size:1.12rem;letter-spacing:-.01em}
.brand svg{flex:none}
.brand span{white-space:nowrap}
.topbar .sync{text-align:right}
.view{width:100%;max-width:820px;margin-inline:auto;padding-block:22px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.view:focus{outline:none;box-shadow:none}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;text-decoration:none;color:var(--ink-3);font-size:.7rem;font-weight:700;letter-spacing:.01em}
.tabbar a svg{width:22px;height:22px}
.tabbar a[aria-current="page"]{color:var(--pine)}
@media (min-width:920px){
  .app{grid-template-columns:236px minmax(0,1fr)}
  .rail{display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px 18px max(16px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);background:var(--surface)}
  .topbar,.tabbar{display:none}
  .view{padding-block:34px 80px}
}
.rail-nav{display:flex;flex-direction:column;gap:2px}
.rail-nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-md);text-decoration:none;color:var(--ink-2);font-weight:700;font-size:.95rem}
.rail-nav a svg{width:18px;height:18px;flex:none}
.rail-nav a:hover{background:var(--sunk);color:var(--ink)}
.rail-nav a[aria-current="page"]{background:var(--pine-soft);color:var(--pine-deep)}
.rail-group{margin:12px 10px 4px;color:var(--ink-3)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}

/* ---------- Buttons, chips ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:9px 16px;border-radius:var(--r-md);border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:700;font-size:.95rem;cursor:pointer;text-decoration:none;line-height:1.2;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{border-color:var(--pine);background:var(--raise)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px;flex:none}
.btn-primary{background:var(--pine);border-color:var(--pine);color:var(--pine-ink)}
.btn-primary:hover{background:var(--pine-deep);border-color:var(--pine-deep);color:var(--pine-ink)}
:root[data-theme="dark"] .btn-primary:hover{color:var(--pine-ink)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--pine)}
.btn-ghost:hover{background:var(--pine-soft);border-color:transparent}
.btn-sm{min-height:34px;padding:6px 11px;font-size:.86rem}
.btn-lg{min-height:52px;padding:12px 22px;font-size:1.05rem}
.btn-block{width:100%}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:var(--r-pill);border:1px solid var(--line-2);background:var(--surface);color:var(--pine);cursor:pointer;flex:none}
.icon-btn:hover{border-color:var(--pine);background:var(--pine-soft)}
.icon-btn svg{width:18px;height:18px}
.icon-btn.sm{width:32px;height:32px}
.icon-btn.sm svg{width:15px;height:15px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:var(--r-pill);background:var(--sunk);color:var(--ink-2);font-size:var(--fs-xs);font-weight:700;border:1px solid transparent;white-space:nowrap}
.chip.pine{background:var(--pine-soft);color:var(--pine-deep)}
.chip.amber{background:var(--amber-soft);color:var(--amber)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
button.chip{cursor:pointer}
button.chip[aria-pressed="true"]{background:var(--pine);color:var(--pine-ink)}
.ev{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;font-weight:500;padding:2px 8px;border-radius:var(--r-pill);border:1px solid currentColor}
.ev::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.ev-solido{color:var(--ev-solido)} .ev-respaldado{color:var(--ev-respaldado)} .ev-emergente{color:var(--ev-emergente)} .ev-discutido{color:var(--ev-discutido)} .ev-mito{color:var(--ev-mito)}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:var(--r-md);background:var(--sunk)}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:7px;font-weight:700;font-size:.88rem;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* ---------- Surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px}
.card.flat{box-shadow:none}
.card.lift{box-shadow:var(--shadow)}
.panel{background:var(--sunk);border-radius:var(--r-lg);padding:16px}
.note{border-left:3px solid var(--amber-fill);background:var(--amber-soft);padding:12px 14px;border-radius:0 var(--r-md) var(--r-md) 0;font-size:var(--fs-sm)}
.note.pine{border-left-color:var(--pine);background:var(--pine-soft)}
.note.bad{border-left-color:var(--bad);background:var(--bad-soft)}
.eyebrow{color:var(--pine)}
.lede{font-size:var(--fs-lg);color:var(--ink-2);max-width:62ch}
.prose p{max-width:66ch}
.prose p+p{margin-top:10px}
.hr{height:1px;background:var(--line);border:0;margin:4px 0}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--pine);font-weight:700;text-decoration:none;background:none;border:0;padding:4px 0;cursor:pointer}
.head{display:flex;flex-direction:column;gap:8px}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden}
.list>*{padding:14px 16px;border-top:1px solid var(--line)}
.list>*:first-child{border-top:0}
.list-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:0;cursor:pointer;color:inherit}
.list-btn:hover{background:var(--raise)}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px}
.bar{height:8px;border-radius:var(--r-pill);background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--pine);border-radius:inherit}
.bar.amber>i{background:var(--amber-fill)}
.kv{display:flex;flex-direction:column;gap:2px}
.kv b{font-family:var(--font-display);font-size:var(--fs-xl);line-height:1.1;font-variant-numeric:tabular-nums}
.empty{padding:22px;text-align:center;color:var(--ink-2)}

/* ---------- Session banner ---------- */
.session-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between;padding:10px 14px;margin-bottom:18px;border-radius:var(--r-md);background:var(--pine-soft);color:var(--pine-deep);font-weight:700;font-size:var(--fs-sm)}

/* ---------- Hoy: prescripción ---------- */
.today-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
@media (min-width:760px){.today-grid{grid-template-columns:minmax(0,1fr) 250px}}
.rx{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow)}
.rx-head{display:flex;gap:14px;align-items:center;padding:16px 18px;border-bottom:1px dashed var(--line-2);background:linear-gradient(180deg,var(--raise),var(--surface))}
.rx-mark{font-family:var(--font-ipa),serif;font-size:2.4rem;line-height:1;color:var(--pine);font-weight:700}
.rx-sig{font-family:var(--font-display);font-weight:700;font-size:1.02rem}
.steps{list-style:none;margin:0;padding:0}
.step{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;padding:15px 18px;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.step-n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-mono);font-size:.82rem;font-weight:500;border:1.5px solid var(--line-2);color:var(--ink-2)}
.step.done .step-n{background:var(--pine);border-color:var(--pine);color:var(--pine-ink)}
.step.next .step-n{border-color:var(--amber-fill);color:var(--amber)}
.step-top{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;justify-content:space-between}
.step-top b{font-family:var(--font-display);font-size:1.05rem}
.step .why{font-size:var(--fs-sm);color:var(--ink-3);margin-top:3px}
.step-act{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.step.done .step-top b{color:var(--ink-2)}
.side{display:flex;flex-direction:column;gap:14px}
.dose{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;align-content:center}
.ring .val b{font-family:var(--font-display);font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums}
.ring .val span{font-size:var(--fs-xs);color:var(--ink-2)}
.blister{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:12px;border-radius:var(--r-md);background:var(--sunk)}
.blister .cell{display:flex;flex-direction:column;align-items:center;gap:4px}
.cap{width:18px;height:40px;border-radius:9px;border:1.5px dashed var(--line-2);background:transparent;overflow:hidden;display:flex;flex-direction:column}
.cap i{flex:1}
.cap.half{border-style:solid;border-color:var(--amber-fill)}
.cap.half i:last-child{background:var(--amber-fill)}
.cap.full{border-style:solid;border-color:var(--pine)}
.cap.full i:first-child{background:var(--amber-fill)}
.cap.full i:last-child{background:var(--pine)}
.cap.today{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--pine-soft)}
.blister .cell span{font-family:var(--font-mono);font-size:.64rem;color:var(--ink-3)}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:8px 4px;padding:14px;border-radius:var(--r-md);background:var(--sunk)}
.month .cap{width:14px;height:30px;border-radius:7px;margin-inline:auto}

/* ---------- Flashcards ---------- */
.flash{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:26px 22px 22px;box-shadow:var(--shadow);min-height:260px;display:flex;flex-direction:column;gap:14px}
.flash .term{font-family:var(--font-display);font-size:clamp(1.6rem,6vw,2.4rem);font-weight:800;line-height:1.15;overflow-wrap:anywhere}
.flash .meaning{font-size:var(--fs-lg);font-weight:700}
.flash .ex{font-size:1.02rem}
.flash .ex em{font-style:normal;color:var(--ink-2)}
.flash-tag{position:absolute;top:12px;right:14px}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:var(--r-md);border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:700}
.rate button small{font-family:var(--font-mono);font-size:.68rem;color:var(--ink-3);font-weight:400}
.rate .r1{border-color:var(--bad)} .rate .r1:hover{background:var(--bad-soft)}
.rate .r2{border-color:var(--warn)} .rate .r2:hover{background:var(--warn-soft)}
.rate .r3{border-color:var(--pine)} .rate .r3:hover{background:var(--pine-soft)}
.rate .r4{border-color:var(--good)} .rate .r4:hover{background:var(--good-soft)}
.counts{display:flex;gap:16px;flex-wrap:wrap}
.counts .kv b{font-size:1.35rem}

/* ---------- Inputs ---------- */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:var(--fs-sm)}
.input,.textarea,.select{width:100%;border:1.5px solid var(--line-2);background:var(--surface);border-radius:var(--r-md);padding:10px 12px;font-size:1rem;color:var(--ink)}
.textarea{min-height:130px;resize:vertical;line-height:1.5}
.input:focus,.textarea:focus,.select:focus{border-color:var(--pine);outline:none;box-shadow:var(--focus)}
.input.ok{border-color:var(--good);background:var(--good-soft)}
.input.no{border-color:var(--bad);background:var(--bad-soft)}

/* ---------- Options / exercises ---------- */
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;width:100%;padding:12px 14px;border-radius:var(--r-md);border:1.5px solid var(--line-2);background:var(--surface);cursor:pointer;font-size:1rem}
.opt:hover{border-color:var(--pine)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.opt .k{font-family:var(--font-mono);font-size:.75rem;color:var(--ink-3);width:18px;flex:none}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair .opt{flex-direction:column;justify-content:center;gap:2px;min-height:86px;text-align:center}
.pair .opt b{font-family:var(--font-display);font-size:1.5rem}
.feedback{padding:12px 14px;border-radius:var(--r-md);font-size:.95rem}
.feedback.ok{background:var(--good-soft);color:var(--good)}
.feedback.no{background:var(--bad-soft);color:var(--bad)}
.feedback.warn{background:var(--warn-soft);color:var(--warn)}
.feedback p+p{margin-top:4px}
.feedback .muted{color:var(--ink-2)}
.tokens{display:flex;flex-wrap:wrap;gap:8px}
.token{padding:8px 12px;border-radius:var(--r-md);border:1.5px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:700}
.token:hover{border-color:var(--pine)}
.token.used{opacity:.3;pointer-events:none}
.token.ok{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.token.no{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.token[disabled]{cursor:default}
.answer-line{min-height:52px;padding:8px;border-radius:var(--r-md);border:1.5px dashed var(--line-2);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line-2)}
.dots i.ok{background:var(--good)} .dots i.no{background:var(--bad)} .dots i.cur{background:var(--amber-fill)}
.wrongright{display:grid;gap:4px}
.wrong{text-decoration:line-through;text-decoration-color:var(--bad);text-decoration-thickness:2px;color:var(--ink-2)}
.right{color:var(--good);font-weight:700}
.diff{line-height:2}
.diff span{padding:2px 4px;border-radius:4px}
.diff .ok{background:var(--good-soft);color:var(--good)}
.diff .miss{background:var(--bad-soft);color:var(--bad);text-decoration:underline wavy}
.diff .extra{background:var(--warn-soft);color:var(--warn);font-style:italic}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md)}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{padding:10px 12px;text-align:left;border-top:1px solid var(--line);vertical-align:top}
th{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);background:var(--sunk);border-top:0}

/* ---------- Listening / reading ---------- */
.line{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:var(--r-md);cursor:pointer}
.line:hover{background:var(--sunk)}
.line.cur{background:var(--amber-soft)}
.line .who{font-family:var(--font-mono);font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;color:var(--pine);min-width:84px;padding-top:3px}
.line.hide-text .txt{filter:blur(6px);user-select:none}
.reader p{font-size:1.08rem;line-height:1.75;max-width:66ch}
.reader p+p{margin-top:14px}
.gl{background:none;border:0;padding:0 1px;font:inherit;color:inherit;border-bottom:2px dotted var(--pine);cursor:pointer}
.gl[aria-expanded="true"]{background:var(--pine-soft)}
.pop{display:inline-flex;align-items:center;gap:6px;margin:0 4px;padding:1px 8px;border-radius:var(--r-pill);background:var(--pine);color:var(--pine-ink);font-size:.86rem;font-weight:700;vertical-align:baseline}
.timer{font-family:var(--font-display);font-size:clamp(3rem,14vw,5rem);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.timer.low{color:var(--bad)}

/* ---------- Chat ---------- */
.chat{display:flex;flex-direction:column;gap:12px}
.bubble{max-width:88%;padding:11px 14px;border-radius:16px;line-height:1.5;overflow-wrap:anywhere}
.bubble.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.bubble.me{align-self:flex-end;background:var(--pine);color:var(--pine-ink);border-bottom-right-radius:4px}
.fix{align-self:flex-end;max-width:88%;font-size:var(--fs-sm);background:var(--amber-soft);border-radius:var(--r-md);padding:8px 12px}
.tip{align-self:flex-start;font-size:var(--fs-sm);color:var(--ink-2)}
.thinking{display:inline-flex;gap:4px}
.thinking i{width:6px;height:6px;border-radius:50%;background:var(--ink-3);animation:blink 1.2s infinite}
.thinking i:nth-child(2){animation-delay:.2s}.thinking i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* ---------- Science chart ---------- */
.chart-wrap{overflow-x:auto}
.chart-wrap svg{display:block;width:100%;min-width:520px;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:var(--fs-sm);color:var(--ink-2)}
.legend i{display:inline-block;width:18px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}

/* ---------- Toast ---------- */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:var(--r-md);font-weight:700;font-size:.92rem;box-shadow:var(--shadow);max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media (min-width:920px){#toast{bottom:28px}}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-xs);color:var(--ink-2);font-weight:700}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.sync.cloud i{background:var(--good)} .sync.local i{background:var(--amber-fill)} .sync.err i{background:var(--bad)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

</style>
</head>

{id:'g-articles', title:'Artículos: a, an, the… o nada', level:'A2',

     ['fill','I study at ___ university in Medellín.',['a'],'university suena /juː/ → a.'],

{id:'g-there', title:'There is / there are + some / any', level:'A1',

{id:'g-count', title:'Contables e incontables: much, many, a lot of', level:'A2',

{id:'r-paracetamol', title:'Paracetamol: useful, but not harmless', level:'A2', minutes:6,

 'Paracetamol is one of the most common medicines in the world. In the United States it is called acetaminophen. People use it to treat pain, like headaches and toothaches, and to reduce fever.',
 'For most healthy adults, the usual dose is 500 milligrams to one gram every four to six hours. The maximum dose is four grams in twenty-four hours. Doctors often recommend a lower maximum for people with liver disease or for people who drink a lot of alcohol.',

{id:'r-antibiotics', title:'Why antibiotics don\'t work on colds', level:'A2–B1', minutes:7,
 before:'¿Alguna vez te recetaron antibiótico para una gripe? Lee y decide si tenía sentido.',
 paras:[
 'Colds and the flu are caused by viruses. Many throat and ear infections are also caused by viruses. Antibiotics work against bacteria, not viruses, so they don\'t help people recover from a cold.',
 'Bacteria and viruses are very different. Bacteria are living cells with their own structures, such as a cell wall. Many antibiotics attack these structures. Viruses don\'t have them: they use our own cells to make copies of themselves.',
 'When people take antibiotics they don\'t need, bacteria in the body are exposed to the drug. The bacteria that survive can multiply, and over time they become resistant. This is called antimicrobial resistance.',
 'Resistance is a serious global problem. A large study published in The Lancet estimated that, in 2019, about 1.27 million deaths were directly caused by resistant bacterial infections. Pharmacists can help by explaining to patients when antibiotics are useful and when they are not.'],
 gloss:[['caused by','causados por'],['ear infections','infecciones de oído'],['recover','recuperarse'],['living cells','células vivas'],['cell wall','pared celular'],['copies of themselves','copias de sí mismos'],['exposed to','expuestas a'],['survive','sobreviven'],['resistant','resistentes'],['deaths','muertes']],

{id:'r-adme', title:'The journey of a tablet', level:'B1', minutes:8,
 before:'Ya conoces ADME en español. Lee buscando cómo se dice cada idea en inglés.',
 paras:[
 'When you swallow a tablet, it begins a long journey. First, it must dissolve in the stomach or the intestine. Only dissolved molecules can cross the gut wall and enter the bloodstream. This step is called absorption.',
 'Before the drug reaches the rest of the body, the blood from the intestine passes through the liver. For some drugs, the liver metabolizes a large part of the dose in this first pass. As a result, the bioavailability of these drugs is low, and the oral dose must be higher than the intravenous dose.',
 'Next comes distribution. The blood carries the drug to the tissues. Some drugs stay mainly in the blood because they bind strongly to plasma proteins, while others spread widely into fat or muscle.',
 'Metabolism changes the drug into new molecules called metabolites, which are usually more water-soluble. Most metabolism happens in the liver, where enzymes such as the cytochrome P450 family do much of the work. Finally, excretion removes the drug and its metabolites, mainly through the kidneys.',
 'These processes explain why a patient with kidney or liver disease may need a different dose. They also explain the half-life: the time needed for the plasma concentration to fall by half.'],
 gloss:[['journey','viaje; recorrido'],['gut wall','pared intestinal'],['first pass','primer paso'],['bioavailability','biodisponibilidad'],['intravenous','intravenoso'],['bind strongly','se unen fuertemente'],['plasma proteins','proteínas plasmáticas'],['spread widely','se distribuyen ampliamente'],['water-soluble','hidrosolubles'],['fall by half','caer a la mitad']],
 q:[['tf','Only dissolved molecules can be absorbed.',null,0],
    ['tf','All drugs have high bioavailability.',null,1],

    ['mc','What are metabolites usually like?',['More fat-soluble','More water-soluble','Exactly the same as the drug'],1]]},

/* Normaliza respuestas: minúsculas, sin puntuación y con contracciones expandidas. */
const CONTR = [[/\bcan't\b/g, 'cannot'], [/\bcan not\b/g, 'cannot'], [/\bwon't\b/g, 'will not'], [/\b(\w+)n't\b/g, '$1 not'], [/\bi'm\b/g, 'i am'], [/\b(\w+)'re\b/g, '$1 are'], [/\b(\w+)'ve\b/g, '$1 have'], [/\b(\w+)'ll\b/g, '$1 will'], [/\b(it|that|there|he|she|what|where|who|here)'s\b/g, '$1 is'], [/\b(i|you|we|they|he|she)'d\b/g, '$1 would']];
function norm(s, opts = {}) {
  let t = String(s || '').toLowerCase().replace(/[’‘`´]/g, "'").replace(/[“”«»"]/g, ' ').replace(/[.,!?;:¡¿()]/g, ' ').replace(/\s+/g, ' ').trim();
  for (const [re, r] of CONTR) t = t.replace(re, r);
  if (opts.numbers) t = t.replace(/\b\d+(\.\d+)?\b/g, m => numWords(Number(m)));
  if (opts.hyphens) t = t.replace(/-/g, ' ');
  return t.replace(/\s+/g, ' ').trim();
}
function lev(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) { const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur; }
  return prev[n];
}
/* tolerant: acepta un error de tipeo en palabras largas (solo vocabulario, nunca gramática). */
function checkAnswer(input, accepted, tolerant = false) {
  const t = norm(input); if (!t) return { ok: false, empty: true, best: accepted[0] };
  let best = Infinity, bestA = accepted[0];
  for (const a of accepted) { const d = lev(t, norm(a)); if (d < best) { best = d; bestA = a; } }
  if (best === 0) return { ok: true, best: bestA };
  if (tolerant && best === 1 && norm(bestA).length >= 5) return { ok: true, close: true, best: bestA };
  return { ok: false, best: bestA };
}
/* Diferencia palabra a palabra (LCS) entre lo esperado y lo dicho/escrito. */
function wdiff(target, said) {
  const T = norm(target, { numbers: true, hyphens: true }).split(' ').filter(Boolean);
  const Sd = norm(said, { numbers: true, hyphens: true }).split(' ').filter(Boolean);
  const m = T.length, n = Sd.length, L = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = m - 1; i >= 0; i--) for (let j = n - 1; j >= 0; j--) L[i][j] = T[i] === Sd[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const out = []; let i = 0, j = 0;
  while (i < m && j < n) { if (T[i] === Sd[j]) { out.push({ w: T[i], t: 'ok' }); i++; j++; } else if (L[i + 1][j] >= L[i][j + 1]) { out.push({ w: T[i], t: 'miss' }); i++; } else { out.push({ w: Sd[j], t: 'extra' }); j++; } }
  while (i < m) out.push({ w: T[i++], t: 'miss' }); while (j < n) out.push({ w: Sd[j++], t: 'extra' });
  const ok = out.filter(x => x.t === 'ok').length;
  return { parts: out, score: m ? ok / m : 0, missed: out.filter(x => x.t === 'miss').map(x => x.w) };
}
function diffHTML(d) { return `<p class="diff">${d.parts.map(p => `<span class="${p.t}">${esc(p.w)}</span>`).join(' ')}</p>`; }

/* Números en palabras (inglés de EE. UU.) */
const ONES = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'];
const TENS = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];
function intWords(n) {
  if (n < 20) return ONES[n];
  if (n < 100) return TENS[Math.floor(n / 10)] + (n % 10 ? '-' + ONES[n % 10] : '');
  if (n < 1000) return ONES[Math.floor(n / 100)] + ' hundred' + (n % 100 ? ' ' + intWords(n % 100) : '');
  return intWords(Math.floor(n / 1000)) + ' thousand' + (n % 1000 ? ' ' + intWords(n % 1000) : '');
}
function numWords(x) {
  if (!isFinite(x)) return String(x);
  const [i, d] = String(x).split('.');
  return intWords(Number(i)) + (d ? ' point ' + d.split('').map(c => ONES[Number(c)]).join(' ') : '');
}

function upgrade(s) {
  const base = freshState();
  if (!s || typeof s !== 'object') return base;
  const out = Object.assign(base, s);
  out.settings = Object.assign(freshState().settings, s.settings || {});
  out.drills = Object.assign(freshState().drills, s.drills || {});
  out.speaking = Object.assign({ n: 0, log: [] }, s.speaking || {});
  for (const k of ['srs', 'days', 'hvpt', 'grammar', 'listening', 'reading']) if (!out[k] || typeof out[k] !== 'object') out[k] = {};
  for (const k of ['custom', 'writing']) if (!Array.isArray(out[k])) out[k] = [];
  return out;
}

/* Nube: la base de datos privada del artefacto (data/users/<id>/progress). Sin ella, solo este navegador. */
const Cloud = { ref: null, writing: false, again: false, readonly: false, mode: 'local', hiddenAt: 0 };
let cloudTimer = null, dirty = false;
function commit() {
  S.updated = Date.now(); dirty = true; pruneDays(); lsSave();
  clearTimeout(cloudTimer); cloudTimer = setTimeout(flushCloud, 2500);
}
function setSync(mode) {
  Cloud.mode = mode;
  const txt = { cloud: 'Guardado en tu cuenta', local: 'Guardado en este navegador', connecting: 'Conectando…', err: 'Sin conexión: guardado aquí' }[mode] || '';
  const short = { cloud: 'En tu cuenta', local: 'En este navegador', connecting: 'Conectando…', err: 'Sin conexión' }[mode] || '';
  const cls = mode === 'cloud' ? 'cloud' : mode === 'err' ? 'err' : 'local';
  $$('[data-sync]').forEach(el => { el.className = 'sync ' + cls; el.innerHTML = `<i></i>${esc(el.dataset.sync === 'short' ? short : txt)}`; el.title = txt; });
}
async function initCloud() {
  if (!(window.claude && typeof window.claude.use === 'function')) { setSync('local'); return; }
  setSync('connecting');
  let db = null, user = null;
  try { [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); } catch (e) { /* sin capacidad */ }
  if (!db || !user) { setSync('local'); return; }
  let uid = null; try { uid = await user.id(); } catch (e) { /* sin id */ }
  if (!uid) { setSync('local'); return; }
  try { Cloud.ref = db.doc('data/users/' + uid + '/progress'); } catch (e) { setSync('local'); return; }
  await pullCloud(true);
}
async function pullCloud(first) {
  if (!Cloud.ref || Cloud.writing) return;
  try {
    const snap = await withTimeout(Cloud.ref.get(), 10000);
    if (snap.exists) {
      const remote = JSON.parse(JSON.stringify(snap.data() || {}));
      if ((first && !hadLocal) || (remote.updated || 0) > (S.updated || 0)) { S = upgrade(remote); lsSave(); render(); }
      else if ((S.updated || 0) > (remote.updated || 0)) flushCloud();
    } else if ((S.updated || 0) > 0) flushCloud();
    if (!Cloud.readonly) setSync('cloud');
  } catch (e) { setSync('err'); }
}
async function flushCloud() {
  clearTimeout(cloudTimer);
  if (!Cloud.ref || Cloud.readonly) return;
  if (Cloud.writing) { Cloud.again = true; return; }
  Cloud.writing = true; dirty = false;
  try { await Cloud.ref.set(JSON.parse(JSON.stringify(S))); setSync('cloud'); }
  catch (e) {

function dayFill(k) {

/* ================= Repetición espaciada ================= */
const ITEMS = [], ITEM = {};
VOCAB.forEach((g, gi) => g.items.forEach((it, ii) => {
  const [lvl, en, es, ex, exEs, tip, ipa] = it;
  let id = slug(en); while (ITEM[id]) id += '-b';
  const o = { id, lvl, en, es, ex: ex || '', exEs: exEs || '', tip: tip || '', ipa: ipa || '', tag: g.tag, tagLabel: g.label, order: lvl * 10000 + ii * 10 + gi };
  ITEMS.push(o); ITEM[id] = o;
}));
function itemById(id) { return ITEM[id] || S.custom.find(c => c.id === id) || null; }
function allItems() { return S.custom.map(c => Object.assign({ tag: 'propia', tagLabel: 'Tuya', lvl: 0, order: -1, tip: '', ipa: '', ex: '', exEs: '' }, c)).concat(ITEMS); }
const cardItem = cid => itemById(cid.replace(/:[rp]$/, ''));
const isLearning = c => c.s === 'learn' || c.s === 'relearn';

function newPool() { const max = LVL_MAX[S.level] || 2; return allItems().filter(it => it.lvl <= max && !S.srs[it.id + ':r']).sort((a, b) => a.order - b.order); }
function prodPool() { return allItems().filter(it => { const r = S.srs[it.id + ':r']; return r && r.s === 'review' && r.ivl >= 3 && !S.srs[it.id + ':p']; }); }
function srsCounts() {
  const now = Date.now(), eod = endOfToday(); let due = 0, learn = 0;
  for (const [id, c] of Object.entries(S.srs)) {
    if (!cardItem(id)) continue;
    if (isLearning(c)) { if (c.due <= now + 20 * MIN) learn++; } else if (c.due <= eod) due++;
  }
  const t = today();
  const newAvail = Math.min(Math.max(0, S.settings.newPerDay - t.newc), newPool().length);
  const prodAvail = Math.min(Math.max(0, 10 - t.prodc), prodPool().length);
  return { due, learn, newAvail, prodAvail, total: due + learn + newAvail + prodAvail };
}
function nextCard() {
  const now = Date.now(), eod = endOfToday(), t = today();
  let best = null;
  for (const [id, c] of Object.entries(S.srs)) if (isLearning(c) && c.due <= now && cardItem(id) && (!best || c.due < best[1].due)) best = [id, c];
  if (best) return best[0];
  const reviews = Object.entries(S.srs).filter(([id, c]) => !isLearning(c) && c.due <= eod && cardItem(id)).sort((a, b) => a[1].due - b[1].due);
  const newOk = t.newc < S.settings.newPerDay, prodOk = t.prodc < 10;
  const n = (UI.repaso && UI.repaso.count) || 0;
  if (reviews.length && !(n % 4 === 3 && (newOk || prodOk))) return reviews[0][0];
  if (prodOk && n % 2 === 0) { const p = prodPool()[0]; if (p) return p.id + ':p'; }
  if (newOk) { const it = newPool()[0]; if (it) return it.id + ':r'; }
  if (prodOk) { const p = prodPool()[0]; if (p) return p.id + ':p'; }
  if (reviews.length) return reviews[0][0];
  for (const [id, c] of Object.entries(S.srs)) if (isLearning(c) && c.due <= now + 20 * MIN && cardItem(id) && (!best || c.due < best[1].due)) best = [id, c];

/* SM-2 modificado: pasos de aprendizaje de 1 y 10 min; facilidad entre 1,3 y ~3; intervalos con pequeña variación. */
function schedule(prev, grade, now = Date.now()) {
  const c = prev ? Object.assign({}, prev) : { s: 'new', step: 0, ivl: 0, ease: 2.5, reps: 0, lapses: 0 };
  const fuzz = d => d < 3 ? d : Math.round(d * (0.95 + Math.random() * 0.1));
  if (c.s === 'new' || isLearning(c)) {
    const steps = c.s === 'relearn' ? [10] : [1, 10];
    if (c.s === 'new') c.s = 'learn';
    if (grade === 1) { c.step = 0; c.due = now + steps[0] * MIN; }
    else if (grade === 2) { c.due = now + Math.round((steps[c.step] || steps[0]) * 1.5) * MIN; }
    else if (grade === 3) {
      c.step++;
      if (c.step >= steps.length) { c.ivl = c.s === 'relearn' ? Math.max(1, c.ivl) : 1; c.s = 'review'; c.step = 0; c.due = now + c.ivl * DAY; }
      else c.due = now + steps[c.step] * MIN;
    } else { c.ivl = c.s === 'relearn' ? Math.max(2, Math.round(c.ivl * 1.5)) : 4; c.s = 'review'; c.step = 0; c.due = now + c.ivl * DAY; }
  } else {
    const late = Math.max(0, (now - c.due) / DAY);
    if (grade === 1) { c.lapses++; c.ease = Math.max(1.3, c.ease - 0.2); c.ivl = Math.max(1, Math.round(c.ivl * 0.5)); c.s = 'relearn'; c.step = 0; c.due = now + 10 * MIN; }
    else {
      if (grade === 2) { c.ease = Math.max(1.3, c.ease - 0.15); c.ivl = Math.max(c.ivl + 1, Math.round(c.ivl * 1.2)); }
      else if (grade === 3) c.ivl = Math.max(c.ivl + 1, Math.round((c.ivl + late / 2) * c.ease));
      else { c.ease = Math.min(3.2, c.ease + 0.15); c.ivl = Math.max(c.ivl + 2, Math.round((c.ivl + late) * c.ease * 1.3)); }
      c.ivl = Math.min(fuzz(c.ivl), 365); c.due = now + c.ivl * DAY;
    }
  }
  c.reps++; c.last = now;
  return c;
}
function fmtIvl(c, now = Date.now()) {
  const ms = c.due - now;
  if (ms < 60 * MIN) return `${Math.max(1, Math.round(ms / MIN))} min`;
  const d = Math.round(ms / DAY);
  if (d < 1) return `${Math.round(ms / (60 * MIN))} h`;
  if (d < 30) return `${d} d`;
  if (d < 365) return `${(d / 30).toFixed(d < 60 ? 1 : 0).replace('.', ',')} mes`;

}

function newHvptRun(setId) {

}
function hvptAcc(id) { const h = S.hvpt[id]; if (!h || !h.last || !h.last.length) return null; return Math.round(100 * h.last.reduce((a, b) => a + b, 0) / h.last.length); }

async function playDialogue(d, opts = {}) {

}

function genDose() {
  const amt = pick(DOSE_AMOUNTS);

  return { amt, unit: unit[0], freq: freq[0], said: `${lead} ${numWords(amt)} ${amt === 1 ? unit[1].replace(/s$/, '') : unit[1]} ${freq[0]}.` };
}

    return `<p class="small muted">Ordena las palabras. Pista: «${esc(es)}»</p>

  }
  return '';
}

function rpRules(sc) {
  return `You are role-playing to help an English learner practise speaking. ${learner()}
Scenario: you are ${sc.ai}. The learner is ${sc.user}.
Rules:

- If the learner writes in Spanish or mixes languages, reply in English and show them how to say it in English.
- Look only at the learner's LAST message. If it has an important error (grammar, word choice, or something unclear), give exactly one correction. Ignore punctuation, capitalization and small typos: the text may come from voice dictation.
- Reply with ONLY a JSON object: {"reply": "your in-character message", "correction": null or {"yours": "the learner's phrase with the error", "better": "a corrected natural version", "note": "very short explanation in Spanish"}, "tip": "a short useful phrase in English the learner could use next, or an empty string"}`;
}
function newChat(id) {

      : v.k === 'tip' ? `<div class="tip">Podrías decir: <span lang="en">«${esc(v.text)}»</span></div>`

ACT.chatSend = async () => {
  const c = UI.habla.chat, ta = $('#chat-in'), text = ((ta && ta.value) || '').trim();

  const input = [c.turns[0]].concat(c.turns.slice(1).slice(-16));

function glossify(paras, gloss, open) {
  const used = new Set();
  return paras.map((p, pi) => {
    let html = esc(p);

      if (used.has(gi)) return;
      const re = new RegExp('(^|[^A-Za-z])(' + escRe(esc(term)) + ')(?![A-Za-z])', 'i');
      if (re.test(html)) {
        used.add(gi);
        html = html.replace(re, (m, pre, w) => `${pre}<button class="gl" data-act="gloss" data-g="${gi}" aria-expanded="${!!open[gi]}">${w}</button>${open[gi] ? `<span class="pop">${esc(gloss[gi][1])}</span>` : ''}`);
      }
    });
    return `<div class="row" style="flex-wrap:nowrap;align-items:flex-start;gap:10px">${playBtn(p, '', 'Escuchar párrafo')}<p class="grow" lang="en">${html}</p></div>`;

}

function lastDays(n) { const out = []; const d = new Date(); for (let i = n - 1; i >= 0; i--) { const x = new Date(d); x.setDate(d.getDate() - i); out.push(x); } return out; }
function minutesChart() {
  const days = lastDays(14), mins = days.map(d => Math.round(((S.days[dkey(d)] || {}).sec || 0) / 60));
  const W = 560, H = 200, L = 34, R = 10, T = 14, B = 28, goal = 58;
  const max = Math.max(60, ...mins), yMax = Math.ceil(max / 15) * 15;
  const y = v => T + (H - T - B) * (1 - v / yMax), bw = (W - L - R) / days.length;
  const ticks = []; for (let v = 0; v <= yMax; v += yMax > 90 ? 30 : 15) ticks.push(v);
  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Minutos de estudio en los últimos 14 días">
    ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" style="fill:var(--ink-3);font:11px var(--font-mono)">${v}</text>`).join('')}
    <line x1="${L}" x2="${W - R}" y1="${y(goal)}" y2="${y(goal)}" style="stroke:var(--amber-fill)" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="${W - R}" y="${y(goal) - 5}" text-anchor="end" style="fill:var(--amber);font:600 11px var(--font-body)">meta ${goal} min</text>
    ${mins.map((m, i) => { const x = L + i * bw + bw * 0.18, w = bw * 0.64, isT = i === days.length - 1; return `<rect x="${x.toFixed(1)}" y="${y(m).toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(0, y(0) - y(m)).toFixed(1)}" rx="3" style="fill:${isT ? 'var(--amber-fill)' : 'var(--pine)'}"/><text x="${(x + w / 2).toFixed(1)}" y="${H - 9}" text-anchor="middle" style="fill:var(--ink-3);font:10px var(--font-mono)">${DOW[days[i].getDay()].slice(0, 2)}</text>`; }).join('')}
  </svg></div>`;
}
function monthBlister() {

  let cells = ['L', 'M', 'X', 'J', 'V', 'S', 'D'].map(x => `<span class="mono faint" style="text-align:center">${x}</span>`).join('');
  for (let i = 0; i < lead; i++) cells += '<span></span>';

  return `<div class="month">${cells}</div>`;

function memoryChart() {
  const W = 600, H = 260, L = 44, R = 14, T = 16, B = 34, days = 30;
  const x = t => L + (W - L - R) * t / days, y = r => T + (H - T - B) * (1 - r);
  const Rf = (t, s) => 1 / (1 + t / (9 * s));
  let none = '', spaced = '';
  for (let t = 0; t <= days; t += 0.25) none += `${t ? 'L' : 'M'}${x(t).toFixed(1)},${y(Rf(t, 1)).toFixed(1)}`;
  const reviews = [[0, 1], [1, 3], [4, 8], [12, 20]];
  reviews.forEach(([t0, s], i) => { const end = i + 1 < reviews.length ? reviews[i + 1][0] : days; for (let t = t0; t <= end + 1e-9; t += 0.25) spaced += `${i === 0 && t === t0 ? 'M' : 'L'}${x(t).toFixed(1)},${y(Rf(t - t0, s)).toFixed(1)}`; });
  const xt = [0, 5, 10, 15, 20, 25, 30], yt = [0, 0.25, 0.5, 0.75, 1];
  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Probabilidad de recordar una palabra con y sin repasos espaciados durante 30 días">
    ${yt.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" style="fill:var(--ink-3);font:11px var(--font-mono)">${v * 100}%</text>`).join('')}
    ${xt.map(v => `<text x="${x(v)}" y="${H - 12}" text-anchor="middle" style="fill:var(--ink-3);font:11px var(--font-mono)">${v} d</text>`).join('')}
    <line x1="${L}" x2="${W - R}" y1="${y(0.9)}" y2="${y(0.9)}" style="stroke:var(--amber-fill)" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="${W - R}" y="${y(0.9) + 16}" text-anchor="end" style="fill:var(--amber);font:600 11px var(--font-body)">umbral de recuerdo (90 %)</text>
    <path d="${none}" fill="none" style="stroke:var(--ink-3)" stroke-width="2"/>
    <path d="${spaced}" fill="none" style="stroke:var(--pine)" stroke-width="2.5" stroke-linejoin="round"/>
    ${reviews.slice(1).map(([t]) => `<circle cx="${x(t)}" cy="${y(1)}" r="4.5" style="fill:var(--pine)"/><text x="${x(t)}" y="${y(1) - 8}" text-anchor="middle" style="fill:var(--pine);font:600 10px var(--font-body)">repaso</text>`).join('')}
    <text x="${x(29.5)}" y="${y(Rf(29.5, 1)) - 8}" text-anchor="end" style="fill:var(--ink-2);font:600 11px var(--font-body)">sin repasar: ${Math.round(Rf(30, 1) * 100)}%</text>
  </svg></div>
  <div class="legend"><span><i style="background:var(--pine)"></i>Con repasos en los días 1, 4 y 12</span><span><i style="background:var(--ink-3)"></i>Una sola sesión, sin repasos</span><span><i style="background:var(--amber-fill)"></i>Umbral, como una concentración mínima eficaz</span></div>`;
}

ACT.askTutor = async el => {
  const key = el.dataset.key, ctx = el.dataset.ctx, ta = document.getElementById('tutor-' + key), q = ((ta && ta.value) || '').trim();
  if (!q) { toast('Escribe tu pregunta.'); return; }
  const st = TUTOR[key] = { q, a: '', busy: true, ctl: new AbortController() };
  render();
  try {
    const r = await AI.fn(`You are a patient English tutor. ${learner()}
Answer the learner's question in Spanish, clearly and briefly (at most about 150 words). Include 2-3 short English examples, preferably from pharmacy, lab or university life. If the answer depends on US vs UK English, or if usage is debated, say so. If the question is not about English, answer briefly and bring it back to English learning.

Question: """${q.slice(0, 1500)}"""`, { signal: st.ctl.signal, onText: ({ text }) => { st.a = text; const out = document.getElementById('tutor-out-' + key); if (out) out.textContent = text; } });
    st.a = r.text;
  } catch (e) {
    st.a = (e && e.text) || '';
    if (!(e && e.code === 'cancelled')) st.a += (st.a ? '\n\n' : '') + AI.fail(e);
  }
  st.busy = false; render();
};

}
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) fn(el, ev);
});
document.addEventListener('input', ev => { const el = ev.target, k = el && el.dataset && el.dataset.input; if (k && INP[k]) INP[k](el, ev); });
document.addEventListener('change', ev => { const el = ev.target, k = el && el.dataset && el.dataset.change; if (k && CHG[k]) CHG[k](el, ev); });
document.addEventListener('keydown', ev => {
  const t = ev.target;
  if ((ev.key === 'Enter' || ev.key === ' ') && t && t.getAttribute && t.getAttribute('role') === 'button' && t.dataset && t.dataset.act) { ev.preventDefault(); t.click(); }
});
addEventListener('hashchange', () => { TTS.stop(); stopTimers(); render(); window.scrollTo(0, 0); });

buildNav();
TTS.init();
render();
initCloud();
AI.init();

})();
</script>
